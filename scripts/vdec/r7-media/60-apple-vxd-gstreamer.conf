# /etc/environment.d/60-apple-vxd-gstreamer.conf (linux-a9 video decoder
# round 7). The user session (systemd --user, uwsm, Hyprland and everything
# it starts) gets this environment.
#
# v4l2slh264dec (gst-plugins-bad, the iPad's VXD) already registers at rank
# primary+1, above avdec_h264 (primary), so playbin/decodebin pick it once
# gst-plugins-bad is installed and the session can open /dev/media0 and
# /dev/video0 (systemd's 70-uaccess.rules gives the seat user both). This
# pins it on top anyway, should a later plugin register an H.264 decoder
# with a higher rank. Caveat: the rank also wins for H.264 the driver refuses
# per picture (interlaced/MBAFF); such a stream shows decode errors instead
# of falling back to software (none of Omarchy's own content is interlaced).
GST_PLUGIN_FEATURE_RANK=v4l2slh264dec:MAX
