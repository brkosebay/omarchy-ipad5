# /etc/systemd/system/systemd-reboot.service.d/50-linux-a9-warm.conf
#
# Stay in Linux on reboot: `systemctl reboot` (and Omarchy's Reboot) kexecs
# into /boot/linux-a9/default instead of resetting the SoC, which would boot
# iOS and need the Mac plus a DFU boot to come back. `linux-a9-kexec ios`
# is the one way out to iOS. If no kernel can be loaded, the system halts.
# docs/boot/warm-reboot.md
[Unit]
SuccessAction=none
FailureAction=halt-force

[Service]
Type=oneshot
TimeoutStartSec=120
ExecStart=
ExecStart=/usr/local/bin/linux-a9-kexec dispatch
