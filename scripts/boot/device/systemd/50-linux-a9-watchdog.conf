# /etc/systemd/system.conf.d/50-linux-a9-watchdog.conf
#
# Never arm the SoC watchdog: when it bites, the SoC resets and the iPad
# boots iOS (coming back needs the Mac and DFU). systemd's default
# RebootWatchdogSec=10min would arm it for every reboot, so a hung kexec
# or a halted fallback would end in iOS minutes later. A hang should stay
# a hang. docs/boot/warm-reboot.md
[Manager]
RuntimeWatchdogSec=off
RebootWatchdogSec=off
KExecWatchdogSec=off
