# linux-a9-update settings (docs/boot/kernel-updates.md). Installed once as
# /etc/linux-a9/update.conf; later installs keep your edits. Unset = default.

# Where `check`/`update` look: a linux-a9-latest.json index (make-bundle.sh).
#SOURCE=https://github.com/brkosebay/linux/releases/latest/download/linux-a9-latest.json

# gc keeps this many entries installed by linux-a9-update, plus default,
# previous, the running and the trial entry. Entries staged another way
# (stage-kernel.sh, kexec-host.sh, the cold-boot entry) are never deleted.
#KEEP=3
# More entry names gc must never delete (e.g. the Mac payload's linux_a9.entry)
#PROTECT=
#MIN_FREE_MB=512

# 1: local bundles need a valid signature too (remote ones always do,
# unless --insecure). Public keys: /etc/linux-a9/update-signers.
#REQUIRE_SIGNATURE=0
#ALLOW_HTTP=0

# Installed entries take the default entry's cmdline, then the bundle's
# required (and recommended) arguments. These keys must survive:
#REQUIRE_KEYS="omarchy.root nvme.write_window"
#RECOMMENDED_ARGS=1
#CMDLINE_EXTRA=

# Trial boot health checks (plus executables in /etc/linux-a9/health.d/)
#HEALTH_TIMEOUT=300
#HEALTH_UNITS="sshd.service"
#HEALTH_NETWORK=1
#HEALTH_NETWORK_IFACES=
#HEALTH_ROOT=nvme
#HEALTH_FAILED_UNITS_OK=1
# 1: a failed trial warm-reboots into the default right away. Off by default:
# kexec out of a half-working kernel can hang (Mac + DFU), while staying up
# keeps the desktop for `linux-a9-update rollback --reboot`.
#AUTO_REBOOT_ON_FAILURE=0
