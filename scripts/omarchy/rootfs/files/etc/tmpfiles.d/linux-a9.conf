# linux-a9 (iPad 5): runtime settings for drivers built into the kernel.

# Omarchy's swap is zram (zram-generator). The kernel config turns zswap on by
# default, which would compress pages a second time in front of it.
w /sys/module/zswap/parameters/enabled - - - - N

# hid_apple is built in, so Omarchy's /etc/modprobe.d/hid_apple.conf
# (fnmode=2: F1-F12 first on keyboards in Apple mode, such as a Keychron K2)
# never reaches it. Same setting, applied at runtime; hid_apple.fnmode=2 on the
# kernel command line does it from the start.
w /sys/module/hid_apple/parameters/fnmode - - - - 2
