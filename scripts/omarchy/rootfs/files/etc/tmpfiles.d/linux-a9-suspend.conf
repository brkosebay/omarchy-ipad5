# linux-a9: allow s2idle (docs/pcie/suspend.md). The kernel refuses system
# sleep unless this is set. Level 2: NVMe's port stays linked, the Wi-Fi port
# takes iOS's port sleep (PME_Turn_Off, L2, power off) and retrains on resume.
# Device-tested 2026-10-22: stages A-F (pm_test and real sleeps woken by Home).
w /sys/module/pcie_apple_h9p/parameters/suspend - - - - 2
# Keep the USB gadget (SSH and netconsole to the Mac) connected through sleep.
w /sys/module/dwc2/parameters/s2idle_keep_gadget - - - - 1
