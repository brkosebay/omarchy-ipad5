# linux-a9: keep kernel messages off the iPad's screen once userspace runs.
# The payload boots with loglevel=7 so early boot stays visible on fbcon, but
# afterwards every suspend/resume (the kernel switches to the text console)
# and driver chatter would print over it. Console level 3 = errors and worse;
# everything still goes to dmesg and netconsole.
kernel.printk = 3 4 1 7
