# linux-a9: the root filesystem is served over usb0 (NBD from the Mac at
# 172.16.42.2). The initramfs configured usb0 as 172.16.42.1/24 before
# switch_root; NetworkManager must never take it down or re-address it.
# linux-a9-usb0-dhcp.service keeps the Mac's DHCP lease alive.
[keyfile]
unmanaged-devices=interface-name:usb0
