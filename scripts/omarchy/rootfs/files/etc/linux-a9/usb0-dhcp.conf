# dnsmasq, DHCP only, for the Mac on the USB gadget link. Same addressing as
# the initramfs (and HoolockRD): iPad 172.16.42.1, Mac 172.16.42.2. The Mac's
# lease from the initramfs is renewed here after switch_root; if it lapsed,
# the Mac would drop 172.16.42.2 and with it the NBD root.
port=0
interface=usb0
except-interface=lo
bind-dynamic
dhcp-authoritative
dhcp-range=172.16.42.2,172.16.42.2,255.255.255.0,12h
# No default route and no DNS server: the Mac must never route its own
# traffic through the iPad.
dhcp-option=3
dhcp-option=6
dhcp-leasefile=/run/linux-a9-usb0-dhcp.leases
log-dhcp
