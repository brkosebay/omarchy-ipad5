# linux-a9: systemd-logind must not act on a lid switch: its default is to
# suspend, and suspend does not resume on this iPad yet. The Smart Cover's input
# device is not named "Lid Switch", so logind doesn't even watch it today; this
# keeps it that way if a kernel names it so. The cover is handled by the user
# daemon ipad-lid (lock and display off; suspend only if switched on there).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
