# linux-a9: systemd-backlight keeps the panel level across boots and kexecs
# (saved on the way down, restored early at boot). Never start below the floor:
# the saved level may be the idle dim, a blanked screen or a closed cover.
[Service]
Environment=LINUX_A9_BACKLIGHT_FLOOR=15 LINUX_A9_BACKLIGHT_DEFAULT=40
ExecStartPost=-/usr/local/sbin/linux-a9-backlight-floor %i
