# linux-a9 rescue console: root shell on the USB ACM gadget (/dev/cu.usbmodem*
# on the Mac), without a password, so a broken network or sshd still leaves a
# way in over the cable. Physical access only. Approved by the orchestrator for
# round 1 (2026-10-22); remove this drop-in to get a normal login prompt.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --noclear --autologin root --keep-baud 115200,57600,38400,9600 - $TERM
