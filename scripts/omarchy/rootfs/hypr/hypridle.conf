# linux-a9 iPad 5: dim after 3 min, screen off after 5 min (DPMS and backlight,
# ipad-screen); system sleep (s2idle) from idle only with `ipad-sleep
# idle-suspend on`. Power sleeps (or only blanks while suspend.target is
# masked or inhibited); touch, a key, Home or Power turn a blanked screen on.
# No lock: the user has no password (docs/omarchy/README.md), so a lock screen
# could not be unlocked. Omarchy's own shell idle (screensaver, lock) is turned
# off in ~/.config/omarchy/shell.json; its "Stay Awake" toggle is honoured here.
# ipad-als-brightness dim/undim is `brightnessctl -s set 10%` / `-r` that also
# tells the ambient-light auto-brightness to leave the backlight alone meanwhile.

general {
    before_sleep_cmd = ipad-screen off
    after_sleep_cmd = ipad-screen on; ipad-als-brightness undim
}

listener {
    timeout = 180
    on-timeout = [ -f ~/.local/state/omarchy/indicators/stay-awake ] || ipad-als-brightness dim
    on-resume = ipad-als-brightness undim
}

listener {
    timeout = 300
    on-timeout = [ -f ~/.local/state/omarchy/indicators/stay-awake ] || ipad-sleep --idle
    on-resume = ipad-screen wake
}

# A screen blanked by the Power button has no idle listener of its own: any
# input after 2 s turns it back on (a no-op unless ipad-screen blanked it).
listener {
    timeout = 2
    on-resume = ipad-screen wake
}
