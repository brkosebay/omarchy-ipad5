# linux-a9 iPad 5 with the Smart Cover wake kernel; see the adjacent README.md.
# Same as scripts/omarchy/rootfs/hypr/hypridle.conf (dim after 3 min, screen
# off after 5 min, no lock: the user has no password). Its before/after sleep
# commands already turn the panel off before every sleep (hypridle holds
# logind's delay lock, so that happens before the session freezes on a cover
# close) and back on after any wake.
# ipad-als-brightness dim/undim is `brightnessctl -s set 10%` / `-r` that also
# tells the ambient-light auto-brightness to leave the backlight alone meanwhile.

general {
    before_sleep_cmd = ipad-screen off
    after_sleep_cmd = ipad-screen on; ipad-als-brightness undim
}

listener {
    timeout = 180
    on-timeout = [ -f ~/.local/state/omarchy/indicators/stay-awake ] || ipad-als-brightness dim
    on-resume = ipad-als-brightness undim
}

listener {
    timeout = 300
    on-timeout = [ -f ~/.local/state/omarchy/indicators/stay-awake ] || ipad-sleep --idle
    on-resume = ipad-screen wake
}

listener {
    timeout = 2
    on-resume = ipad-screen wake
}
