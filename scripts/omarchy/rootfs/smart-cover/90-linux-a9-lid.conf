# linux-a9 iPad 5, Smart Cover wake kernel only (s8003-j71t-smart-cover.dtb):
# closing the cover suspends (s2idle), opening it wakes the iPad through the
# D2365 PMIC event IRQ. Replaces /etc/systemd/logind.conf.d/90-linux-a9-lid.conf
# once docs/power/smart-cover-test-plan.md step D1 has passed. On the polled
# default DTB a close would still suspend, but only Home/Power could wake.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
# iOS sleeps on every close: a sleep inhibitor does not veto it (the default).
LidSwitchIgnoreInhibited=yes
# No docks or external displays here. logind re-checks a still-closed lid when
# the hold-off after a resume ends, so a stray wake sleeps again after 5 s.
HoldoffTimeoutSec=5s
